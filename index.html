 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Lobby Animado</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Arial', sans-serif;
        }

        .lobby-container {
            position: relative;
            width: 100vw;
            height: 56.25vw; 
            max-height: 100vh;
            max-width: 177.78vh;
            margin: auto;
            top: 50%;
            transform: translateY(-50%);
            overflow: hidden;
        }

        .lobby-bg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: filter 0.3s ease;
        }

        /* CAPA DE ANIMACIÓN DE PARTÍCULAS (EFECTO LOBBY VIVO) */
        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* Contador de Diamantes Mejorado */
        .diamond-overlay {
            position: absolute;
            top: 2.1%; 
            left: 31.5%;
            width: 4.8%;
            height: 4.5%;
            background-color: #171d25; 
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 2px;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.1s ease;
        }

        .diamond-overlay:active {
            transform: scale(1.1); /* Efecto de hundirse al tocar */
            box-shadow: 0 0 10px #00bfff;
        }

        .diamond-text {
            color: #ffffff;
            font-size: 1.1vw; 
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.5px;
        }

        /* Zona del Botón INICIAR */
        .btn-iniciar-overlay {
            position: absolute;
            bottom: 2%;
            right: 4.1%;
            width: 13.5%;
            height: 10.5%;
            cursor: pointer;
            z-index: 10;
        }

        /* Animación Pro de Emparejamiento (Filtro Rojo de Combate) */
        .searching-match {
            animation: pulseMatch 1.2s infinite ease-in-out;
            filter: sepia(0.4) saturate(1.8) hue-rotate(340deg);
        }

        @keyframes pulseMatch {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        @media (min-aspect-ratio: 16/9) {
            .diamond-text { font-size: 1.95vh; }
        }
    </style>
</head>
<body>

    <div class="lobby-container" id="lobby-box">
        <img src="image.jpeg" alt="Lobby" class="lobby-bg" id="lobby-img">
        
        <canvas class="particles" id="particleCanvas"></canvas>
        
        <div class="diamond-overlay" onclick="sumarDiamantes()">
            <span class="diamond-text" id="diamond-count">10000+</span>
        </div>

        <div class="btn-iniciar-overlay" onclick="presionarIniciar()"></div>
    </div>

    <audio id="musica-lobby" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    <audio id="sonido-clic" src="https://actions.google.com/sounds/v1/ui/click.ogg"></audio>

    <script>
        let cantidad = 10000;
        let musicaSonando = false;

        // Función para reproducir música (se activa con el primer clic en CUALQUIER lado)
        document.body.addEventListener('click', () => {
            const musica = document.getElementById('musica-lobby');
            if (!musicaSonando) {
                musica.volume = 0.4;
                musica.play().catch(e => console.log("Audio en espera"));
                musicaSonando = true;
            }
        });

        // Esta función corre de inmediato al dar clic en los diamantes
        function sumarDiamantes() {
            cantidad += 1000;
            document.getElementById('diamond-count').innerText = cantidad + '+';
            
            // Intenta reproducir el sonido de clic
            const clickSound = document.getElementById('sonido-clic');
            clickSound.currentTime = 0;
            clickSound.play().catch(e => {});
        }

        // Simulación animada de inicio de partida
        function presionarIniciar() {
            const clickSound = document.getElementById('sonido-clic');
            clickSound.currentTime = 0;
            clickSound.play().catch(e => {});
            
            const lobbyImg = document.getElementById('lobby-img');
            
            // Si ya está buscando, lo cancela
            if(lobbyImg.classList.contains('searching-match')) {
                lobbyImg.classList.remove('searching-match');
            } else {
                lobbyImg.classList.add('searching-match');
                // Alerta nativa simulando el juego
                setTimeout(() => {
                    alert("¡PARTIDA ENCONTRADA!\nEntrando al servidor de juego...");
                    lobbyImg.classList.remove('searching-match');
                }, 4000);
            }
        }

        // CÓDIGO JAVASCRIPT PARA ANIMAR LAS PARTÍCULAS DEL LOBBY
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1 + 0.5;
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y -= this.speedY;
                if (this.y < 0) {
                    this.y = canvas.height + Math.random() * 100;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(255, 215, 0, ${this.alpha})`; // Color oro/amarillo Free Fire
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            for (let i = 0; i < 40; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>

</body>
</html>
